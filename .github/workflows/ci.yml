name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  node-tests:
    name: Node unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test

  python-tests:
    name: Python unit tests (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [ocr-service, llm-service]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r apps/${{ matrix.service }}/requirements.txt
      - run: pytest -q
        working-directory: apps/${{ matrix.service }}

  docker-e2e:
    name: Docker Compose end-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Validate Compose configuration
        run: docker compose config

      - name: Build all containers
        run: docker compose build

      - name: Start stack
        run: docker compose up -d

      - name: Wait for frontend and API
        shell: bash
        run: |
          set -euo pipefail
          for i in {1..60}; do
            if curl -fsS http://localhost:3000/health >/dev/null && curl -fsS http://localhost:8080/ >/dev/null; then
              echo "Stack is healthy"
              docker compose ps
              exit 0
            fi
            sleep 2
          done
          echo "Stack did not become healthy"
          docker compose ps
          exit 1

      - name: Create sample invoice image and PDF
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          from PIL import Image, ImageDraw, ImageFont

          image = Image.new("RGB", (1600, 800), "white")
          draw = ImageDraw.Draw(image)
          font_path = "/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf"
          title = ImageFont.truetype(font_path, 64)
          body = ImageFont.truetype(font_path, 50)

          lines = [
              ("INVOICE", title),
              ("Invoice No: INV-42", body),
              ("Vendor: Example Technologies Pvt Ltd", body),
              ("Date: 2026-10-04", body),
              ("Subtotal: 1000.00", body),
              ("Tax: 250.50", body),
              ("Total: 1250.50", body),
          ]

          y = 50
          for text, font in lines:
              draw.text((70, y), text, fill="black", font=font)
              y += 100

          image.save("/tmp/invoice.png")
          image.save("/tmp/invoice.pdf", "PDF", resolution=150.0)
          PY

      - name: Verify image and PDF end to end through frontend proxy
        shell: bash
        run: |
          set -euo pipefail

          verify_document() {
            local file="$1"
            local expected_invoice="$2"
            local expected_total="$3"

            curl -fsS               -F "file=@$file"               http://localhost:8080/api/documents               > /tmp/upload.json

            cat /tmp/upload.json
            DOCUMENT_ID="$(python -c 'import json; print(json.load(open("/tmp/upload.json"))["id"])')"

            completed=false
            for i in {1..60}; do
              curl -fsS "http://localhost:8080/api/documents/$DOCUMENT_ID" > /tmp/result.json
              STATUS="$(python -c 'import json; print(json.load(open("/tmp/result.json"))["status"])')"
              echo "$file attempt $i: $STATUS"

              if [ "$STATUS" = "completed" ]; then
                completed=true
                break
              fi

              if [ "$STATUS" = "failed" ]; then
                cat /tmp/result.json
                return 1
              fi

              sleep 2
            done

            if [ "$completed" != "true" ]; then
              echo "Timed out processing $file"
              cat /tmp/result.json
              return 1
            fi

            python - "$expected_invoice" "$expected_total" <<'PY'
          import json
          import sys

          expected_invoice = sys.argv[1]
          expected_total = float(sys.argv[2])
          doc = json.load(open("/tmp/result.json"))

          assert doc["status"] == "completed", doc
          result = doc["result"]
          assert result["documentType"] == "invoice", result
          assert result["invoiceNumber"] == expected_invoice, result
          assert abs(float(result["total"]) - expected_total) < 0.01, result
          print("Verified:", result)
          PY
          }

          verify_document /tmp/invoice.png INV-42 1250.50
          verify_document /tmp/invoice.pdf INV-42 1250.50

      - name: Verify document list endpoint
        run: |
          curl -fsS http://localhost:8080/api/documents > /tmp/documents.json
          python - <<'PY'
          import json
          docs = json.load(open("/tmp/documents.json"))
          assert len(docs) >= 2, docs
          assert all(d["status"] == "completed" for d in docs[:2]), docs
          print("Document list contains completed jobs")
          PY

      - name: Show container logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop stack
        if: always()
        run: docker compose down -v
