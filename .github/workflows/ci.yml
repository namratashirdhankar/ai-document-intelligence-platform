name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  node-tests:
    name: Node unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: npm test

  python-tests:
    name: Python unit tests (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [ocr-service, llm-service]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r apps/${{ matrix.service }}/requirements.txt
      - run: pytest -q
        working-directory: apps/${{ matrix.service }}

  docker-e2e:
    name: Docker Compose end-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Validate Compose configuration
        run: docker compose config

      - name: Build all containers
        run: docker compose build

      - name: Start stack
        run: docker compose up -d

      - name: Wait for API
        shell: bash
        run: |
          set -euo pipefail
          for i in {1..60}; do
            if curl -fsS http://localhost:3000/health >/dev/null; then
              echo "API is healthy"
              exit 0
            fi
            sleep 2
          done
          echo "API did not become healthy"
          docker compose ps
          exit 1

      - name: Create sample invoice
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          from PIL import Image, ImageDraw, ImageFont

          image = Image.new("RGB", (1400, 700), "white")
          draw = ImageDraw.Draw(image)
          font_path = "/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf"
          title = ImageFont.truetype(font_path, 58)
          body = ImageFont.truetype(font_path, 46)

          draw.text((70, 60), "INVOICE", fill="black", font=title)
          draw.text((70, 170), "Invoice No: INV-42", fill="black", font=body)
          draw.text((70, 260), "Vendor: Example Technologies Pvt Ltd", fill="black", font=body)
          draw.text((70, 350), "Date: 2026-10-04", fill="black", font=body)
          draw.text((70, 440), "Subtotal: 1000.00", fill="black", font=body)
          draw.text((70, 530), "Tax: 250.50", fill="black", font=body)
          draw.text((70, 610), "Total: 1250.50", fill="black", font=body)
          image.save("/tmp/invoice.png")
          PY

      - name: Upload and verify document processing
        shell: bash
        run: |
          set -euo pipefail

          curl -fsS             -F "file=@/tmp/invoice.png"             http://localhost:3000/documents             > /tmp/upload.json

          cat /tmp/upload.json
          DOCUMENT_ID="$(python -c 'import json; print(json.load(open("/tmp/upload.json"))["id"])')"

          completed=false
          for i in {1..60}; do
            curl -fsS "http://localhost:3000/documents/$DOCUMENT_ID" > /tmp/result.json
            STATUS="$(python -c 'import json; print(json.load(open("/tmp/result.json"))["status"])')"
            echo "Attempt $i: $STATUS"

            if [ "$STATUS" = "completed" ]; then
              completed=true
              break
            fi

            if [ "$STATUS" = "failed" ]; then
              cat /tmp/result.json
              exit 1
            fi

            sleep 2
          done

          if [ "$completed" != "true" ]; then
            echo "Document processing timed out"
            cat /tmp/result.json
            exit 1
          fi

          cat /tmp/result.json

          python - <<'PY'
          import json

          doc = json.load(open("/tmp/result.json"))
          assert doc["status"] == "completed", doc

          result = doc["result"]
          assert result["documentType"] == "invoice", result
          assert result["invoiceNumber"] == "INV-42", result
          assert abs(float(result["total"]) - 1250.50) < 0.01, result

          print("E2E verification passed:", result)
          PY

      - name: Show container logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop stack
        if: always()
        run: docker compose down -v
