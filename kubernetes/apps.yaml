apiVersion: apps/v1
kind: Deployment
metadata: { name: api }
spec:
  replicas: 2
  selector: { matchLabels: { app: api } }
  template:
    metadata: { labels: { app: api } }
    spec:
      containers:
      - name: api
        image: ghcr.io/namratashirdhankar/ai-document-intelligence-api:latest
        envFrom: [{ configMapRef: { name: aidoc-config } }]
        ports: [{ containerPort: 3000 }]
        readinessProbe: { httpGet: { path: /health, port: 3000 }, initialDelaySeconds: 5, periodSeconds: 10 }
        livenessProbe: { httpGet: { path: /health, port: 3000 }, initialDelaySeconds: 15, periodSeconds: 20 }
        resources: { requests: { cpu: 100m, memory: 128Mi }, limits: { cpu: 500m, memory: 512Mi } }
        volumeMounts: [{ name: uploads, mountPath: /data/uploads }]
      volumes: [{ name: uploads, persistentVolumeClaim: { claimName: uploads } }]
---
apiVersion: v1
kind: Service
metadata: { name: api }
spec: { selector: { app: api }, ports: [{ port: 3000, targetPort: 3000 }] }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: worker }
spec:
  replicas: 2
  selector: { matchLabels: { app: worker } }
  template:
    metadata: { labels: { app: worker } }
    spec:
      containers:
      - name: worker
        image: ghcr.io/namratashirdhankar/ai-document-intelligence-worker:latest
        envFrom: [{ configMapRef: { name: aidoc-config } }]
        resources: { requests: { cpu: 100m, memory: 128Mi }, limits: { cpu: "1", memory: 512Mi } }
        volumeMounts: [{ name: uploads, mountPath: /data/uploads }]
      volumes: [{ name: uploads, persistentVolumeClaim: { claimName: uploads } }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: ocr-service }
spec:
  replicas: 1
  selector: { matchLabels: { app: ocr-service } }
  template:
    metadata: { labels: { app: ocr-service } }
    spec:
      containers:
      - name: ocr
        image: ghcr.io/namratashirdhankar/ai-document-intelligence-ocr:latest
        ports: [{ containerPort: 8000 }]
        readinessProbe: { httpGet: { path: /health, port: 8000 }, initialDelaySeconds: 5, periodSeconds: 10 }
        resources: { requests: { cpu: 250m, memory: 256Mi }, limits: { cpu: "2", memory: 1Gi } }
---
apiVersion: v1
kind: Service
metadata: { name: ocr-service }
spec: { selector: { app: ocr-service }, ports: [{ port: 8000, targetPort: 8000 }] }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: llm-service }
spec:
  replicas: 1
  selector: { matchLabels: { app: llm-service } }
  template:
    metadata: { labels: { app: llm-service } }
    spec:
      containers:
      - name: llm
        image: ghcr.io/namratashirdhankar/ai-document-intelligence-llm:latest
        env:
        - name: OPENAI_API_KEY
          valueFrom: { secretKeyRef: { name: aidoc-secrets, key: OPENAI_API_KEY, optional: true } }
        ports: [{ containerPort: 8001 }]
        readinessProbe: { httpGet: { path: /health, port: 8001 }, initialDelaySeconds: 5, periodSeconds: 10 }
        resources: { requests: { cpu: 100m, memory: 128Mi }, limits: { cpu: 500m, memory: 512Mi } }
---
apiVersion: v1
kind: Service
metadata: { name: llm-service }
spec: { selector: { app: llm-service }, ports: [{ port: 8001, targetPort: 8001 }] }
