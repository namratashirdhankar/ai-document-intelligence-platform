<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Document Intelligence</title><style>body{font-family:system-ui;max-width:800px;margin:40px auto;padding:0 20px}pre{background:#f5f5f5;padding:16px;white-space:pre-wrap;border-radius:8px}button{padding:8px 14px;margin-left:8px}</style></head><body><h1>AI Document Intelligence</h1><p>Upload an invoice or receipt image or PDF. OCR and structured extraction run asynchronously.</p><input id="file" type="file" accept="image/*,application/pdf"><button onclick="upload()">Process</button><pre id="out">Ready.</pre><script>
async function upload(){const f=document.getElementById('file').files[0];if(!f)return;const fd=new FormData();fd.append('file',f);const r=await fetch('/api/documents',{method:'POST',body:fd});const j=await r.json();show(j);if(j.id)poll(j.id)}
async function poll(id){for(let i=0;i<60;i++){await new Promise(r=>setTimeout(r,1500));const j=await(await fetch('/api/documents/'+id)).json();show(j);if(['completed','failed'].includes(j.status))break}}
function show(j){document.getElementById('out').textContent=JSON.stringify(j,null,2)}
</script></body></html>
