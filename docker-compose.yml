services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
      POSTGRES_DB: ${POSTGRES_DB:-documents}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app} -d ${POSTGRES_DB:-documents}"]
      interval: 5s
      timeout: 3s
      retries: 15
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 15

  ocr-service:
    build: ./apps/ocr-service
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 15

  llm-service:
    build: ./apps/llm-service
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 10s
      timeout: 5s
      retries: 15

  api:
    build: ./apps/api
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://app:app@postgres:5432/documents}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      UPLOAD_DIR: ${UPLOAD_DIR:-/data/uploads}
      PORT: 3000
    ports:
      - "3000:3000"
    volumes:
      - uploads:/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: ./apps/worker
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://app:app@postgres:5432/documents}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      OCR_URL: ${OCR_URL:-http://ocr-service:8000}
      LLM_URL: ${LLM_URL:-http://llm-service:8001}
      UPLOAD_DIR: ${UPLOAD_DIR:-/data/uploads}
    volumes:
      - uploads:/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ocr-service:
        condition: service_healthy
      llm-service:
        condition: service_healthy

  frontend:
    build: ./apps/frontend
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  pgdata:
  uploads:
